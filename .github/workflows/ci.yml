name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check Python tools
        run: |
          python3 -m py_compile bin/9router-patcher
          python3 -m py_compile bin/9router-sync-free
          python3 -m py_compile bin/9router-sync-skills

      - name: Syntax check Bash scripts
        run: |
          bash -n bin/9router-suite
